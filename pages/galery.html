<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - IVSS Laboratory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <section class="gallery-hero">
        <div class="gallery-hero-content">
            <h1>Galeri Dokumentasi</h1>
            <p>Kumpulan foto kegiatan dan fasilitas laboratorium</p>
        </div>
    </section>

    <section class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-grid" id="galleryGrid">
                <div class="gallery-item">
                    <img src="../assets/gambar/galeri1.jpg" alt="Dokumentasi 1" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/comp.jpg" alt="Komputer Lab" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/cam.jpg" alt="Camera Setup" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/light.jpg" alt="Lighting Equipment" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/meet.jpg" alt="Meeting" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/profil1.jpg" alt="Profile 1" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/profil2.jpg" alt="Profile 2" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/profil3.jpg" alt="Profile 3" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../assets/gambar/rak.jpg" alt="Rak Peralatan" loading="lazy">
                    <div class="gallery-overlay">
                        <i class="fas fa-search-plus"></i>
                    </div>
                </div>
                
            </div>
            

            <div class="load-more-container" id="loadMoreContainer">
                <button class="btn-load-more" id="loadMoreBtn">
                    <span class="btn-text">Muat Foto Lainnya</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>
    </section>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div class="lightbox-nav">
            <button class="lightbox-btn" id="lightbox-prev"><i class="fas fa-chevron-left"></i></button>
            <button class="lightbox-btn" id="lightbox-next"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/script.js"></script>
</body>

</html>
