<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale-1.0" />
    <title>Registrasi Member - IVSS Laboratory</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/pendaftaran.css" />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="register-page-content">
      <div class="register-container">
      <section class="registration-form-section">
        <div class="form-container">
          <p class="form-label">FORM PENDAFTARAN MEMBER</p>
          <h2 class="form-title">Gabung Dengan Komunitas Kami</h2>

          <form action="#" method="POST">
            <div class="form-grid">
              <div class="form-group">
                <label for="nama-lengkap"
                  >Nama Lengkap <span class="required">*</span></label
                >
                <input
                  type="text"
                  id="nama-lengkap"
                  name="nama_lengkap"
                  placeholder="John Doe"
                  required
                />
              </div>
              <div class="form-group">
                <label for="nim">NIM <span class="required">*</span></label>
                <input
                  type="text"
                  id="nim"
                  name="nim"
                  placeholder="214xxxxxxx"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email <span class="required">*</span></label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="john.doe@polinema.ac.id"
                required
              />
            </div>

            <div class="form-group">
              <label for="prodi"
                >Program Studi <span class="required">*</span></label
              >
              <input
                type="text"
                id="prodi"
                name="prodi"
                placeholder="D4 Teknik Informatika"
                required
              />
            </div>

            <div class="form-footer">
              <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms"
                  >Saya setuju dengan syarat dan ketentuan.</label
                >
              </div>
              <button type="submit" class="btn-submit">Daftar</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/script.js"></script>
  </body>
</html>
