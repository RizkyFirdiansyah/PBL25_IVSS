<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - IVSS Laboratory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/feedback.css">

</head>

<body>
    <div id="navbar-placeholder"></div>

    <section class="hero-kontak reveal">
        <div class="hero-content">
            <h1>KONTAK</h1>
            <p>Jika Anda memiliki kritik, saran, atau ingin berkolaborasi, jangan ragu untuk menghubungi kami melalui formulir di bawah ini. Kami siap membantu Anda!</p>
        </div>
    </section>

    <section class="contact-section reveal">
        <div class="contact-content">
            <div class="contact-form-box">
                <p class="form-label">FORMULIR TANGGAPAN LAB IVSS</p>
                <h2 class="form-title">Hubungi Kami, berikan keritik & saran</h2>
                <form id="contactForm" action="#" method="post" class="contact-form">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email" required>
                    </div>

                    <div class="form-group">
                        <label for="kritik-saran">Kritik dan Saran <span class="required">*</span></label>
                        <textarea id="kritik-saran" name="kritik-saran" placeholder="Masukkan kritik dan saran Anda"
                            required></textarea>
                    </div>

                    <div class="form-footer">
                        <div class="checkbox-group">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">Saya setuju dengan syarat dan ketentuan.</label>
                        </div>
                        <button type="submit" class="btn-submit">Kirim</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/script.js"></script>
</body>

</html>
